name: Build-and-Push-Strata-P100-Image-to-aliyun

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许在 GitHub 页面手动点击触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 登录阿里云容器镜像服务（个人版）
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 设置 Docker Buildx，用于构建和缓存
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建并推送，显式指定 P100 的计算能力
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 替换成你的阿里云镜像地址
          tags: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/strata:p100
          # 关键：通过 build-arg 传入 P100 的计算能力
          build-args: |
            CUDA_ARCHITECTURES=60
          # 启用 GitHub Actions 缓存，加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
